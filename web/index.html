<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nanobot WebSocket 通道实验室</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --line: #2a2f3a;
    --text: #e6e8ee; --muted: #98a1b3; --dim: #6b7488;
    --accent: #7aa2f7; --teal: #5dcaa5; --amber: #ef9f27; --purple: #afa9ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; font-weight: 500; margin: 0; }
  .pill {
    font-size: 12px; padding: 2px 9px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--muted);
  }
  .pill.ok { color: var(--teal); border-color: #235c4a; }
  .pill.bad { color: #f09595; border-color: #5c2323; }
  main { flex: 1; display: flex; min-height: 0; }
  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; }
  .row.me { justify-content: flex-end; }
  .bubble {
    max-width: 76%; padding: 9px 13px; border-radius: 12px; white-space: pre-wrap;
    word-break: break-word; border: 1px solid var(--line); background: var(--panel-2);
  }
  .row.me .bubble { background: #23324f; border-color: #2f4570; }
  .bubble.streaming::after {
    content: "▍"; color: var(--accent); animation: blink 1s step-end infinite; margin-left: 2px;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .trace {
    font-size: 12px; color: var(--dim); padding: 2px 4px;
    border-left: 2px solid var(--line); margin-left: 6px;
  }
  .trace b { color: var(--amber); font-weight: 500; }
  .meta { font-size: 11px; color: var(--dim); margin-top: 4px; }
  footer { border-top: 1px solid var(--line); padding: 12px; background: var(--panel); display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 9px; padding: 10px 13px; font: inherit; outline: none;
  }
  input[type=text]:focus { border-color: #3a4664; }
  button {
    background: #23324f; color: var(--text); border: 1px solid #2f4570;
    border-radius: 9px; padding: 10px 16px; font: inherit; cursor: pointer;
  }
  button:hover { background: #2b3d60; }
  button.ghost { background: transparent; border-color: var(--line); color: var(--muted); }
  aside {
    width: 400px; border-left: 1px solid var(--line); background: #12151b;
    display: flex; flex-direction: column; min-height: 0;
  }
  aside h2 {
    font-size: 12px; font-weight: 500; color: var(--muted); margin: 0;
    padding: 10px 14px; border-bottom: 1px solid var(--line); letter-spacing: .04em;
  }
  #log { flex: 1; overflow-y: auto; padding: 8px 12px; font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }
  .ev { padding: 3px 0; border-bottom: 1px dashed #1d222b; color: var(--muted); }
  .ev .name { color: var(--accent); }
  .ev.delta .name { color: var(--teal); }
  .ev.message .name { color: var(--purple); }
  .ev.stream_end .name { color: var(--amber); }
  @media (max-width: 900px) { aside { display: none; } }
</style>
</head>
<body>
<header>
  <h1>nanobot WebSocket 通道实验室</h1>
  <span class="pill" id="status">connecting…</span>
  <span class="pill" id="clientId">client_id: —</span>
  <span class="pill" id="chatId">chat_id: —</span>
  <button class="ghost" id="newChat">新会话</button>
</header>

<main>
  <section id="chat">
    <div id="messages"></div>
    <footer>
      <input type="text" id="input" placeholder="输入消息后回车（试试 /help）" autocomplete="off">
      <button id="send">发送</button>
    </footer>
  </section>
  <aside>
    <h2>原始事件流（协议示波器）</h2>
    <div id="log"></div>
  </aside>
</main>

<script>
// ---------------------------------------------------------------------------
// 迷你版 nanobot WebUI 客户端：只做三件事——连接、发消息、渲染事件。
// 对照真实前端：webui/src/... 用 WebSocket 多路复用协议，事件名完全一致。
// ---------------------------------------------------------------------------

const el = (id) => document.getElementById(id);
let socket = null;
let chatId = null;
let clientId = "lab-" + Math.random().toString(36).slice(2, 8);
let streamBubble = null;

function logEvent(payload) {
  const item = document.createElement("div");
  item.className = "ev " + (payload.event || "");
  const text = JSON.stringify(payload, null, 0);
  item.innerHTML = `<span class="name">${payload.event || "?"}</span> ${escapeHtml(text)}`;
  el("log").prepend(item);
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function addBubble(text, cls) {
  const row = document.createElement("div");
  row.className = "row " + (cls || "");
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  row.appendChild(bubble);
  el("messages").appendChild(row);
  el("messages").scrollTop = el("messages").scrollHeight;
  return bubble;
}

function addTrace(label, text) {
  const div = document.createElement("div");
  div.className = "trace";
  div.innerHTML = `<b>${escapeHtml(label)}</b> ${escapeHtml(text)}`;
  el("messages").appendChild(div);
  el("messages").scrollTop = el("messages").scrollHeight;
}

// ---------------------------------------------------------------------------
// 1) 建立连接：服务端会先推一条 ready，里面带 chat_id
// ---------------------------------------------------------------------------
function connect() {
  const url = `ws://${location.host}/?client_id=${encodeURIComponent(clientId)}`;
  socket = new WebSocket(url);

  socket.onopen = () => {
    el("status").textContent = "connected";
    el("status").className = "pill ok";
  };
  socket.onclose = () => {
    el("status").textContent = "closed";
    el("status").className = "pill bad";
  };
  socket.onerror = () => {
    el("status").textContent = "error";
    el("status").className = "pill bad";
  };
  socket.onmessage = (event) => {
    // 关键：所有下行都是一条 JSON 事件
    let payload;
    try { payload = JSON.parse(event.data); } catch { return; }
    handleEvent(payload);
  };
}

// ---------------------------------------------------------------------------
// 2) 事件处理：与 nanobot/tui/src/app.ts:1187 的 switch 结构一一对应
// ---------------------------------------------------------------------------
function handleEvent(payload) {
  logEvent(payload);

  switch (payload.event) {
    case "ready":
      // 握手完成：拿到本连接的默认 chat_id
      chatId = payload.chat_id;
      clientId = payload.client_id || clientId;
      el("chatId").textContent = "chat_id: " + chatId.slice(0, 8);
      el("clientId").textContent = "client_id: " + clientId;
      break;

    case "delta":
      // 流式增量：就地追加到同一个气泡
      if (!streamBubble) {
        streamBubble = addBubble("", "me");
        streamBubble.classList.add("streaming");
        streamBubble.closest(".row").className = "row";  // 助手气泡靠左
      }
      streamBubble.textContent += payload.text || "";
      el("messages").scrollTop = el("messages").scrollHeight;
      break;

    case "stream_end":
      // 一段流结束：移除光标
      if (streamBubble) {
        streamBubble.classList.remove("streaming");
        streamBubble = null;
      }
      break;

    case "message":
      // 最终消息 / 中间态面包屑
      if (payload.kind === "tool_hint") addTrace("工具", payload.text);
      else if (payload.kind === "progress") addTrace("进度", payload.text);
      else {
        if (streamBubble) { streamBubble.classList.remove("streaming"); streamBubble = null; }
        const bubble = addBubble(payload.text || "", "");
        bubble.closest(".row").className = "row";
        if (payload.latency_ms !== undefined) {
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = `latency ${payload.latency_ms} ms`;
          bubble.appendChild(meta);
        }
      }
      break;

    case "attached":
      chatId = payload.chat_id;
      el("chatId").textContent = "chat_id: " + chatId.slice(0, 8);
      addTrace("系统", "已订阅 " + chatId.slice(0, 8));
      break;

    case "error":
      addTrace("错误", payload.detail || "");
      break;
  }
}

// ---------------------------------------------------------------------------
// 3) 发送消息：信封结构 {type, chat_id, content, turn_id}
//    对照 tui/src/protocol.ts:1285 send()
// ---------------------------------------------------------------------------
function sendMessage() {
  const input = el("input");
  const content = input.value.trim();
  if (!content || !chatId || socket.readyState !== WebSocket.OPEN) return;

  const turnId = crypto.randomUUID();
  socket.send(JSON.stringify({
    type: "message",
    chat_id: chatId,
    content: content,
    turn_id: turnId,
    webui: true,
  }));

  addBubble(content, "me");
  input.value = "";
  logEvent({ event: "↑ 上行", type: "message", chat_id: chatId, content, turn_id: turnId });
}

el("send").onclick = sendMessage;
el("input").addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
el("newChat").onclick = () => {
  // 换一个 chat_id 就等于开一个新会话（服务端按 chat_id 隔离会话）
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({ type: "attach", chat_id: crypto.randomUUID() }));
  }
};

connect();
</script>
</body>
</html>
